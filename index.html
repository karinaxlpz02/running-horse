<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wild Type — Motion in characters</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><a class="wordmark" href="./">WILD TYPE<span>®</span></a><span class="edition">STUDIES IN TYPOGRAPHIC MOTION — № 001</span><span class="live"><i></i> LIVE RENDER</span></header>
  <main>
    <div class="intro"><div class="eyebrow">AN EXPERIMENT IN CREATIVE CODE</div><h1>Born to <em>run.</em></h1><p>A little wildness, written in characters.<br>No images. Just type in motion.</p></div>
    <section class="stage" aria-label="Animated galloping horse drawn entirely with text characters"><canvas id="horse"></canvas><div class="stage-label"><span>EQUUS CABALLUS</span><span>FIG. 01 / GALLOP</span></div><div class="ground"></div></section>
    <div class="controls"><button id="play" aria-label="Pause animation"><span id="play-icon">Ⅱ</span><span id="play-text">Pause</span></button><div class="speed"><label for="speed">PACE</label><input id="speed" type="range" min="0.35" max="2" step="0.05" value="1"><output id="pace">1.0×</output></div><div class="character"><label for="alphabet">CHARACTER SET</label><select id="alphabet"><option value="type">Aa / Type</option><option value="symbols">#& / Symbols</option><option value="binary">01 / Binary</option></select></div><button id="theme" aria-label="Toggle light and dark appearance">◐ <span>Invert</span></button></div>
  </main>
  <footer><span>UNTAMED BY DESIGN.</span><span class="footer-note">Thousands of characters. One restless spirit.</span><span>TYPE → MOTION</span></footer>
  <script src="horse.js"></script>
</body>
</html>
